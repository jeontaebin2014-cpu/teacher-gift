<!DOCTYPE html>
<html>
<head>
    <title>선생님 상장 만들기</title>
    <style>
        /* 상장 디자인 */
        .certificate {
            width: 500px;
            padding: 50px;
            /* #gold에서 #을 지웠어요! */
            border: 10px double gold; 
            text-align: center;
            margin: 20px auto;
            background-color: #f9f9f9;
        }
        h1 { font-size: 40px; color: #333; }
        .content { font-size: 20px; margin: 30px 0; }
        
        /* 인쇄할 때 버튼은 안 보이게 설정 */
        @media print {
            .print-button { display: none; }
        }
    </style>
</head>
<body>

    <div class="certificate">
        <h1>상 장</h1>
        <div class="content">
            <p><strong>최고의 선생님상</strong></p>
            <p>성함: <strong>우진아 선생님</strong></p>
            <br>
            <p>위 선생님은 평소 저희를 사랑으로 가르치시고<br>
            언제나 응원해 주셨으므로 이 상을 드립니다.</p>
            <br>
            <p>2026년 5월 15일</p>
            <p>제자 일동 올림</p>
        </div>
    </div>

    <div style="text-align: center;">
        <button class="print-button" onclick="window.print();">상장 출력하기</button>
    </div>

</body>
</html>
